<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Plan B</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ENCABEZADO (igual que en las otras páginas, pero "Contacto" queda activo) -->
  <header class="encabezado">
    <a href="index.html" class="logo">
      <img src="Imagenes/Logo.png" alt="Logo de Plan B">
    </a>
    <nav class="menu">
      <a href="index.html">Inicio</a>
      <a href="menu.html">Menú</a>
      <a href="espacio.html">Espacio</a>
      <a href="juegos.html">Juegos</a>
      <a href="contacto.html" class="activo">Contacto</a>
    </nav>
  </header>

  <main class="pagina-contacto">

    <h1 class="titulo-contacto">Contacto</h1>

    <!-- DATOS DE CONTACTO -->
    <ul class="datos-contacto">
      <li>@PlanBcafe</li>
      <li>PlanB@gmail.com</li>
      <li>1136787636</li>
    </ul>

    <div class="contacto-contenido">

      <!-- FORMULARIO DE RESERVA -->
      <section class="reserva">
        <h2>Reservá tu mesa</h2>

        <form id="form-reserva">

          <label for="nombre">Nombre y apellido</label>
          <input type="text" id="nombre" name="nombre" required>

          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" required>

          <label for="personas">Cantidad de personas</label>
          <input type="number" id="personas" name="personas" min="1" max="12" required>

          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>

          <label for="horario">Horario</label>
          <input type="time" id="horario" name="horario" min="08:00" max="20:00" required>

          <label for="sector">Sector</label>
          <select id="sector" name="sector" required>
            <option value="" disabled selected>Elegí un sector</option>
            <option value="Salón">Estudio/trabajo</option>
            <option value="Ventanal">Juegos</option>
          </select>

          <button type="submit" class="boton-reserva">Confirmar reserva</button>

          <!-- Mensaje que aparece al confirmar -->
          <p id="mensaje-reserva" class="mensaje-reserva" role="status" hidden></p>
        </form>
      </section>

      <!-- UBICACIÓN -->
      <aside class="ubicacion-contacto">
        <p>Encontranos en</p>
        <h3>Palermo Soho,</h3>
        <p>sobre la calle El Salvador al 2073</p>
        <iframe
          class="mapa"
          src="https://www.google.com/maps?q=El+Salvador+4600,+Palermo,+Buenos+Aires,+Argentina&z=17&output=embed"
          title="Mapa de ubicación de Plan B en Palermo Soho"
          loading="lazy"
          allowfullscreen></iframe>
      </aside>

    </div>

  </main>

  <!-- PIE DE PÁGINA (igual que en las otras páginas) -->
  <footer class="pie">
    <div class="pie-horarios">
      <h4>Horarios</h4>
      <p>De lunes a sábados de 8 a 20</p>
    </div>
    <div class="pie-copy">
      <p>&copy; 2026 PLAN B</p>
    </div>
    <div class="pie-contacto">
      <p>@PlanBcaf</p>
      <p>Hola@planbcafe.com</p>
    </div>
  </footer>

  <script>
    const formulario = document.getElementById("form-reserva");
    const mensaje = document.getElementById("mensaje-reserva");
    const campoFecha = document.getElementById("fecha");

    // No permite elegir fechas pasadas
    campoFecha.min = new Date().toISOString().split("T")[0];

    formulario.addEventListener("submit", function (evento) {
      evento.preventDefault();   // evita que la página se recargue

      const nombre = document.getElementById("nombre").value;
      mensaje.textContent = "¡Reserva exitosa! Te esperamos, " + nombre + ".";
      mensaje.hidden = false;

      formulario.reset();        // vacía los campos
    });
  </script>

</body>
</html>
